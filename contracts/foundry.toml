[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"        # Monad supports Cancun opcodes (TLOAD/TSTORE). VERIFY before mainnet deploy.
optimizer = true
optimizer_runs = 10_000
via_ir = false
bytecode_hash = "none"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
]
fs_permissions = [
  { access = "read-write", path = "./bench-out" },
  { access = "read", path = "./script/config" },
  { access = "read-write", path = "../deployments" },
]
gas_reports = ["*"]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.ci.fuzz]
runs = 5_000

[profile.ci.invariant]
runs = 512
depth = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[lint]
lint_on_build = false   # run `forge lint` explicitly in CI instead
