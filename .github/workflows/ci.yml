name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (fmt, build, test, interfaces doc, abis)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # pinned: every gas ceiling, size check and fork rehearsal was produced with forge 1.5.1; `stable` moved to
          # 1.8.4 on 1 Oct and fails the gas-ceiling tests (place 69,090 ≥ 60,001) and CreateContractSizeLimit on main.
          # Bump deliberately after the 8 Oct freeze, with the gas tests re-baselined.
          version: v1.5.1

      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check

      - name: forge build
        working-directory: contracts
        # forge 1.5.1 `--sizes` exits 1 on EIP-170 (24,576 B); ClearingHouse is ~26.5 KB by design (Monad allows 128 KB,
        # ARCHITECTURE R7, foundry.toml code_size_limit). The build itself must pass; the size table is informational,
        # and the test suite deploys every contract under the 131,072 B limit.
        run: |
          forge build
          forge build --sizes || echo "::notice::contracts exceed EIP-170 by design (Monad limit 128 KB, ARCHITECTURE R7)"

      - name: forge test
        working-directory: contracts
        # forge 1.5.1 + FOUNDRY_PROFILE=ci: suites with inline `forge-config` (Vault, FundingSwap invariants) may append
        # to an existing file under the fs_permissions path but not create one; bench-out/ is gitignored, so create them.
        run: |
          mkdir -p bench-out && touch bench-out/fs_invariant_coverage.csv bench-out/vault_invariant_coverage.csv
          forge test -vvv

      # A PR that edits contracts/src/interfaces/** without regenerating docs/INTERFACES.md fails here.
      - name: INTERFACES.md in sync
        run: python3 tools/gen_interfaces_md.py --check

      # TS packages consume abis/*.json; they must match the compiled contracts.
      - name: abis/ in sync
        run: |
          bash tools/export_abis.sh
          git diff --exit-code -- abis/ || { echo "abis/ is stale: run tools/export_abis.sh"; exit 1; }

  ts:
    name: ts packages (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skipped until the first TS package lands a lockfile.
      - id: lock
        run: echo "present=$([ -f pnpm-lock.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.lock.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.lock.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.lock.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --if-present run lint
          pnpm -r --if-present run typecheck
          pnpm -r --if-present run test
