# Earn open + close (MOBILE_PLAN N6): Home → Earn → $10 on the numpad → legs in plain words → tap alternative → receipt
# timeline → the Earn position's Close → confirm → receipt. Needs: Perpl setup done, testnet AUSD in the wallet, both
# books with liquidity and a funding gap (otherwise the screen says "No edge right now" and the flow stops there).
appId: ${APP_ID}
---
- launchApp
- runFlow: subflows/open-dev.yaml
- runFlow: subflows/unlock.yaml
- tapOn:
    id: "btn-home-earn"
- tapOn:
    id: "earn-key-1"
- tapOn:
    id: "earn-key-0"
- extendedWaitUntil:
    visible:
      id: "earn-legs"
    timeout: 20000
- tapOn:
    id: "earn-confirm-tap"
- extendedWaitUntil:
    visible:
      id: "earn-receipt-title"
    timeout: 90000
- assertVisible:
    id: "earn-receipt-timeline"
- tapOn:
    id: "earn-receipt-done"
- extendedWaitUntil:
    visible:
      id: "earn-position"
    timeout: 20000
- tapOn:
    id: "earn-close"
- assertVisible:
    id: "earn-close-summary"
- tapOn:
    id: "earn-close-confirm-tap"
- extendedWaitUntil:
    visible:
      id: "earn-receipt-title"
    timeout: 90000
- tapOn:
    id: "earn-receipt-done"
