      - event: BadDebtCovered
      - event: MarketAuthorized
  - name: MarketFactory
    abi_file_path: ../abis/IMarketFactory.json
    events:
      - event: MarketRegistered
      - event: MarketStatusChanged
  - name: KuruHedger
    abi_file_path: ../abis/IKuruHedger.json
